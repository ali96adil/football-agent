name: v1 foundation

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/collector
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'

  frontend:
    name: Frontend production build (x86_64)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - name: Require the native x86 runner
        run: test "$(uname -m)" = "x86_64"
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: football_intelligence
          POSTGRES_USER: football_app
          POSTGRES_PASSWORD: test-password-only
        options: >-
          --health-cmd "pg_isready -U football_app -d football_intelligence"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    defaults:
      run:
        working-directory: services/collector
    env:
      APP_DB_HOST: 127.0.0.1
      APP_DB_PORT: "5432"
      APP_DB_NAME: football_intelligence
      APP_DB_USER: football_app
      APP_DB_PASSWORD: test-password-only
      MIGRATIONS_ROOT: ../..
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Migrate empty test database
        run: python scripts/migrate.py
      - name: Validate checksum and queue schema
        run: |
          python scripts/migrate.py
          python - <<'PY'
          import os
          import psycopg
          url = f"postgresql://{os.environ['APP_DB_USER']}:{os.environ['APP_DB_PASSWORD']}@{os.environ['APP_DB_HOST']}/{os.environ['APP_DB_NAME']}"
          with psycopg.connect(url) as connection:
              assert connection.execute("select to_regclass('core.jobs')").fetchone()[0] == "core.jobs"
          PY
      - name: PostgreSQL queue concurrency and migration atomicity
        env:
          RUN_POSTGRES_INTEGRATION: "1"
        run: python -m unittest tests.test_postgres_job_queue tests.test_postgres_migrations -v
      - name: Migrate a current-schema fixture
        run: bash ../../scripts/ci-migrate-current-schema.sh

  compose-and-arm64:
    name: Compose and release checks (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose structure
        run: |
          docker compose --env-file .env.ci config --quiet
          docker compose --env-file .env.ci config --format json \
            | python3 scripts/ci_assert_compose.py
      - name: Validate deploy and rollback dry-runs
        run: |
          cp .env.ci .env
          PREFLIGHT_SKIP_RUNTIME=1 ./scripts/test_release_dry_runs.sh
      - name: Reject unsafe x86-to-ARM64 frontend cross-builds
        run: |
          log_file="$(mktemp)"
          if docker buildx build --platform linux/arm64 --target dependencies \
            --progress plain -f frontend/Dockerfile frontend >"$log_file" 2>&1; then
            echo "Frontend cross-build unexpectedly succeeded." >&2
            exit 1
          fi
          grep -F "frontend runtime images require a native builder" "$log_file"

  arm64-runtime:
    name: ARM64 runtime images (native)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Require a native ARM64 runner and enable Buildx
        run: |
          test "$(uname -m)" = "aarch64"
          docker buildx create --name foundation-builder --driver docker-container --use
          docker buildx inspect --bootstrap
      - name: Validate ARM64 collector runtime
        run: |
          docker buildx build --platform linux/arm64 --load \
            -f services/collector/Dockerfile -t football-api-ci .
          test "$(docker image inspect --format '{{.Architecture}}' football-api-ci)" = "arm64"
          docker run --rm --platform linux/arm64 --entrypoint python football-api-ci -c \
            "from pathlib import Path; required=['requirements.txt','app','scripts/migrate.py','scripts/worker.py','database/001_core_schema.sql','database/migrations/008_add_job_queue.sql']; missing=[p for p in required if not Path('/app', p).exists()]; assert not missing, missing"
      - name: Build and exercise the ARM64 frontend runtime
        run: |
          docker buildx build --platform linux/arm64 --load \
            -f frontend/Dockerfile -t football-frontend-ci frontend
          ./scripts/validate_frontend_arm64_runtime.sh football-frontend-ci
